name: Main
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    name: ${{ matrix.script-name }}

    strategy:
      fail-fast: false
      matrix:
        script-name: [lint, build]

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify the Actions lockfile
        if: matrix.script-name == 'lint'
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Running ${{ matrix.script-name }}
        run: npm run ${{ matrix.script-name }}
        env:
          # The build has no Firestore to read content from, so it builds the pages without content.
          FIRESTORE_TARGET: none

  test-project:
    runs-on: ubuntu-latest
    name: test (${{ matrix.project }})

    strategy:
      fail-fast: false
      matrix:
        project:
          [
            Web,
            Server,
            'Stages*',
            Hydration,
            Functions,
            CLI,
            Firestore,
            'Sample data',
            Translations,
          ]

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json

      - name: Setup Java (required by the Firestore emulator)
        if: matrix.project == 'Firestore' || matrix.project == 'Sample data'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Running ${{ matrix.project }} tests
        run: npx vitest run --project "${{ matrix.project }}"

  # Builds the site with each feature off, and builds a minimal site.
  smoke:
    runs-on: ubuntu-latest
    name: smoke

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Running smoke tests
        run: npx vitest run --project 'Smoke*'

  # Builds the demo site with the sample data and a minimal site, and runs axe on them in Chromium.
  a11y:
    runs-on: ubuntu-latest
    name: a11y

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/web/package-lock.json') }}

      - name: Install Chromium
        run: npx --prefix packages/web playwright install --with-deps chromium

      - name: Running A11y tests
        run: npx vitest run --project A11y

      - name: Upload the axe results and screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: a11y-results
          path: packages/web/test-results/a11y

  # The one required check: it fails when any other job in this workflow fails.
  main-required:
    if: ${{ !cancelled() }}
    needs: [checks, test-project, smoke, a11y]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
