name: Main
on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    name: ${{ matrix.script-name }}

    strategy:
      fail-fast: false
      matrix:
        script-name: [lint, build]

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Running ${{ matrix.script-name }}
        run: npm run ${{ matrix.script-name }}
        env:
          # The build has no Firestore to read content from, so it builds the pages without content.
          FIRESTORE_TARGET: none

  test-project:
    runs-on: ubuntu-latest
    name: test (${{ matrix.project }})

    strategy:
      fail-fast: false
      matrix:
        project: [Web, Server, Functions, CLI, Firestore, Translations]

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Setup Java (required by the Firestore emulator)
        if: matrix.project == 'Firestore'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Running ${{ matrix.project }} tests
        run: npx vitest run --project ${{ matrix.project }}

  # Renders the app with each feature off, and builds a minimal site.
  smoke:
    runs-on: ubuntu-latest
    name: smoke

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Running smoke tests
        run: npx vitest run --project 'Smoke*'

  # One required check that passes only when every test project and the smoke tests pass.
  test:
    runs-on: ubuntu-latest
    name: test
    needs: [test-project, smoke]
    if: always()

    steps:
      - name: Check test results
        run: |
          test "${{ needs.test-project.result }}" = success
          test "${{ needs.smoke.result }}" = success
