name: Security
on:
  push:
  pull_request:
  # New advisories appear without code changes.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # Unpinned actions, broad permissions, template injection and risky triggers.
  zizmor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false

  # Accepted advisories are listed, with the reason, in packages/cli/src/commands/audit-deps.ts.
  audit-deps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
      - run: npm ci
      - run: ./hb audit-deps

  # New dependencies with high or critical advisories.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
