name: Deploy Preview
on: pull_request

permissions:
  contents: read
  checks: write
  pull-requests: write
  # Lets google-github-actions/auth request a GitHub OIDC token for Workload Identity Federation.
  id-token: write

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run build
      # `./hbd setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.DEPLOY_SERVICE_ACCOUNT }}'
      # action-hosting-deploy only accepts credentials as text, not a file path.
      - id: credentials
        run: |
          credentials=$(jq -c . "$GOOGLE_APPLICATION_CREDENTIALS")
          echo "::add-mask::$credentials"
          echo "json=$credentials" >> "$GITHUB_OUTPUT"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          projectId: hoverboard-master
          firebaseServiceAccount: '${{ steps.credentials.outputs.json }}'
