name: Deploy
on:
  push:
    branches:
      - main
  # Rebuilds the pages from the current Firestore content, for example after editing it.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
# A manual run and a push never deploy at the same time.
concurrency: deploy
jobs:
  deploy:
    # A manual run can pick any branch. Only main deploys to the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `./hb setup-github` limits this environment to the default branch.
    environment:
      name: production
      url: ${{ steps.project.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      # Fails when packages/config has no site.json, so a fork doesn't deploy the demo site.
      # Upstream, whose site is the demo, sets the HB_DEMO variable to true.
      - id: project
        run: |
          id=$(./hb config project-id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "url=$(./hb config url)" >> "$GITHUB_OUTPUT"
        env:
          HB_DEMO: ${{ vars.HB_DEMO }}
      # `./hb setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: abraham/firebase-wif@e4a526efa5ff407acb4803981ce528c6e47b3e24 # v0.2.1
        with:
          workload_identity_provider: '${{ vars.FIREBASE_WIF_PROVIDER }}'
          service_account: '${{ vars.FIREBASE_WIF_SERVICE_ACCOUNT }}'
          project_id: '${{ steps.project.outputs.id }}'
      # The build renders each page from the site's content in Firestore.
      - run: npm run build
        env:
          FIRESTORE_TARGET: production
      # `--force` deletes functions that are no longer in the code, which non-interactive mode
      # otherwise refuses to do, and accepts Firebase's other deploy confirmations.
      # `./hb deploy-args` adds `--except functions` when features.functions is false.
      - run: npx firebase deploy --project "$PROJECT_ID" --non-interactive --force $(./hb deploy-args)
        env:
          PROJECT_ID: ${{ steps.project.outputs.id }}
