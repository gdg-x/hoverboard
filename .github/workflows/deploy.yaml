name: Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      # `./hbd setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.DEPLOY_SERVICE_ACCOUNT }}'
      # The build renders each page from the site's content in Firestore.
      - run: npm run build
        env:
          FIRESTORE_TARGET: production
      - run: npx firebase deploy --project "$(jq -r .firebase.projectId packages/config/site.json)" --non-interactive
