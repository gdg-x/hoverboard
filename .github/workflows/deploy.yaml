name: Deploy
on:
  push:
    branches:
      - main
  # Rebuilds the pages from the current Firestore content, for example after editing it.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
# A manual run and a push never deploy at the same time.
concurrency: deploy
jobs:
  deploy:
    # A manual run can pick any branch. Only main deploys to the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      # `./hbd setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.DEPLOY_SERVICE_ACCOUNT }}'
      # The build renders each page from the site's content in Firestore.
      - run: npm run build
        env:
          FIRESTORE_TARGET: production
      - run: npx firebase deploy --project "$(jq -r .firebase.projectId packages/config/site.json)" --non-interactive
