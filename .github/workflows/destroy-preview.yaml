name: Destroy Preview
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  # Lets abraham/firebase-wif request a GitHub OIDC token for Workload Identity Federation.
  id-token: write

jobs:
  destroy_preview:
    name: Destroy Preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      - id: project
        run: echo "id=$(./hb config project-id)" >> "$GITHUB_OUTPUT"
        env:
          HB_DEMO: ${{ vars.HB_DEMO }}
      # `./hb setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: abraham/firebase-wif@e4a526efa5ff407acb4803981ce528c6e47b3e24 # v0.2.1
        with:
          workload_identity_provider: '${{ vars.FIREBASE_WIF_PROVIDER }}'
          service_account: '${{ vars.FIREBASE_WIF_SERVICE_ACCOUNT }}'
          project_id: '${{ steps.project.outputs.id }}'
      # The channel name action-hosting-deploy gives a pull request (src/getChannelId.ts).
      - run: |
          channel="pr${PR_NUMBER}-${HEAD_REF:0:20}"
          channel="${channel//[^a-zA-Z0-9_.-]/_}"
          npx firebase hosting:channel:delete "$channel" --force --project "$PROJECT_ID"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
