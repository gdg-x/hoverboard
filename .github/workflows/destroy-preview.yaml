name: Destroy Preview
on:
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  destroy_preview:
    name: Destroy Preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Lets abraham/firebase-wif request a GitHub OIDC token for Workload Identity Federation.
      id-token: write
    # Cancels a preview deploy that is still running for the pull request.
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
      - run: npm ci
      - id: project
        run: echo "id=$(./hb config project-id)" >> "$GITHUB_OUTPUT"
        env:
          HB_DEMO: ${{ vars.HB_DEMO }}
      # `./hb setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: abraham/firebase-wif@v0.2.1
        with:
          workload_identity_provider: '${{ vars.FIREBASE_WIF_PROVIDER }}'
          service_account: '${{ vars.FIREBASE_WIF_SERVICE_ACCOUNT }}'
          project_id: '${{ steps.project.outputs.id }}'
      # The channel name action-hosting-deploy gives a pull request (src/getChannelId.ts).
      - run: |
          channel="pr${PR_NUMBER}-${HEAD_REF:0:20}"
          channel="${channel//[^a-zA-Z0-9_.-]/_}"
          npx firebase hosting:channel:delete "$channel" --force --project "$PROJECT_ID"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
