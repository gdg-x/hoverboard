name: Destroy Preview
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  destroy_preview:
    name: Destroy Preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci
      - id: get-short-pr
        run: |
          echo "pr=$(echo ${{github.head_ref}} | cut -c 1-20)" >> $GITHUB_OUTPUT
      # `./hb setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.DEPLOY_SERVICE_ACCOUNT }}'
      - run: npx firebase hosting:channel:delete pr${{ github.event.pull_request.number }}-${{ steps.get-short-pr.outputs.pr }} --force --project "$(jq -r .firebase.projectId packages/config/site.json)"
