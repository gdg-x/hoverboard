name: Destroy Preview
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  # Lets google-github-actions/auth request a GitHub OIDC token for Workload Identity Federation.
  id-token: write

jobs:
  destroy_preview:
    name: Destroy Preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      # `./hb setup-github` sets these variables. See docs/tutorials/04-deploy.md.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.DEPLOY_SERVICE_ACCOUNT }}'
      # The channel name action-hosting-deploy gives a pull request (src/getChannelId.ts).
      - run: |
          channel="pr${PR_NUMBER}-${HEAD_REF:0:20}"
          channel="${channel//[^a-zA-Z0-9_.-]/_}"
          npx firebase hosting:channel:delete "$channel" --force --project "$(jq -r .firebase.projectId packages/config/site.json)"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
